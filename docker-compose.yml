services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: GestionOrdinateursDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/gestion-ordinateurs-realm.json:/opt/keycloak/data/import/gestion-ordinateurs-realm.json:ro
    networks:
      - appnet

  gestionordinateurs-api:
    image: ${DOCKER_ACCOUNT:-local}/gestionordinateurs-api:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.API/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:5100
      Authentication__Authority: http://keycloak:8080/realms/gestion-ordinateurs
      Authentication__ValidIssuer: http://localhost:8180/realms/gestion-ordinateurs
      Authentication__Audience: gestionordinateurs-api
      Authentication__RequireHttpsMetadata: "false"
      ConnectionStrings__ParcInfo: Data Source=/data/parcinfo.db
    ports:
      - "5100:5100"
    volumes:
      - gestion_ordinateurs_data:/data
    networks:
      - appnet

  authentification-api:
    image: ${DOCKER_ACCOUNT:-local}/authentificationapi:latest
    build:
      context: .
      dockerfile: AuthentificationApi/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:5210
    depends_on:
      - gestionordinateurs-api
    ports:
      - "5210:5210"
    networks:
      - appnet

  gestionordinateurs-gateway:
    image: ${DOCKER_ACCOUNT:-local}/gestionordinateurs-gateway:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Gateway/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:5010
      Authentication__Authority: http://keycloak:8080/realms/gestion-ordinateurs
      Authentication__ValidIssuer: http://localhost:8180/realms/gestion-ordinateurs
      Authentication__Audience: gestionordinateurs-api
      Authentication__RequireHttpsMetadata: "false"
      ReverseProxy__Clusters__gestionOrdinateurs__Destinations__api__Address: http://gestionordinateurs-api:5100/
    depends_on:
      - gestionordinateurs-api
      - keycloak
    ports:
      - "5010:5010"
    networks:
      - appnet

  gestionordinateurs-client:
    image: ${DOCKER_ACCOUNT:-local}/gestionordinateurs-client:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Client/Dockerfile
    depends_on:
      - authentification-api
      - gestionordinateurs-gateway
    ports:
      - "5000:5000"
    networks:
      - appnet

volumes:
  postgres_data:
  keycloak_data:
  gestion_ordinateurs_data:

networks:
  appnet:
