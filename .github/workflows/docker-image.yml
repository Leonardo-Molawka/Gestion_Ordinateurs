name: CI/CD Docker GestionOrdinateurs

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOCKER_ACCOUNT: ${{ secrets.DOCKER_ACCOUNT }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GestionOrdinateurs.sln

      - name: Build
        run: dotnet build GestionOrdinateurs.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test GestionOrdinateurs.sln --no-build --configuration Release --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: tests
    env:
      JWT_KEY: ci-build-only-signing-key-not-used-at-runtime
      POSTGRES_PASSWORD: ci-build-only-not-used-at-runtime
      KEYCLOAK_ADMIN_PASSWORD: ci-build-only-not-used-at-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Hub account
        run: test -n "$DOCKER_ACCOUNT"

      - name: Build application images
        run: docker compose build authentification-api gestionordinateurs-api gestionordinateurs-gateway gestionordinateurs-client

      - name: Push application images
        run: docker compose push authentification-api gestionordinateurs-api gestionordinateurs-gateway gestionordinateurs-client
